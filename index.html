<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#070b1f">
<title>Astro Sağlık Görevi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b1f; --panel:rgba(14,20,50,.86); --panel2:rgba(26,36,84,.92); --ink:#f3f6ff; --muted:#a9b6e3;
  --accent:#00a2ff; --accent-d:#0072c6; --yellow:#ffcf33; --good:#33d17a; --warn:#ffa62b; --bad:#ff4d6d;
  --line:rgba(255,255,255,.14); --shadow:rgba(0,0,0,.38);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#070b1f; --panel:rgba(14,20,50,.86); --ink:#f3f6ff; } }
:root[data-theme="dark"]{ --bg:#070b1f; --panel:rgba(14,20,50,.86); --ink:#f3f6ff; }

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:'Fredoka','Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:none;outline:none}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

/* ---------- Butonlar ---------- */
.btn{border:none;border-radius:14px;padding:12px 22px;font-size:18px;font-weight:700;color:#fff;background:var(--accent);
  box-shadow:0 5px 0 var(--accent-d),0 8px 18px var(--shadow);transition:transform .06s, box-shadow .06s, filter .15s;letter-spacing:.3px}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--accent-d),0 3px 8px var(--shadow)}
.btn:disabled{filter:grayscale(.8) brightness(.7);cursor:not-allowed}
.btn.green{background:#2fbf63;box-shadow:0 5px 0 #1d8a43,0 8px 18px var(--shadow)}
.btn.green:active{box-shadow:0 1px 0 #1d8a43}
.btn.yellow{background:var(--yellow);color:#3a2a00;box-shadow:0 5px 0 #c99a0b,0 8px 18px var(--shadow)}
.btn.yellow:active{box-shadow:0 1px 0 #c99a0b}
.btn.red{background:#ff4d6d;box-shadow:0 5px 0 #c22a47,0 8px 18px var(--shadow)}
.btn.red:active{box-shadow:0 1px 0 #c22a47}
.btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.35)}
.btn.big{font-size:24px;padding:16px 30px;border-radius:18px}
.btn.small{font-size:15px;padding:8px 14px;border-radius:11px}

.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 14px 40px rgba(0,0,0,.45)}

/* ---------- Ekranlar ---------- */
#screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;
  background:radial-gradient(ellipse at center,rgba(7,11,31,.25),rgba(7,11,31,.75));z-index:20}
.wrap{width:100%;max-width:980px;margin:auto}
.logo{text-align:center;margin-bottom:14px}
.logo h1{font-size:clamp(38px,7vw,74px);line-height:1;font-weight:700;letter-spacing:2px;
  background:linear-gradient(180deg,#fff 0%,#9fe3ff 55%,#3fa9ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 5px 0 #0b3b8f) drop-shadow(0 10px 22px rgba(0,0,0,.6))}
.logo .sub{display:inline-block;margin-top:8px;background:var(--yellow);color:#3a2a00;font-weight:700;padding:6px 16px;border-radius:999px;
  font-size:clamp(14px,2.2vw,19px);box-shadow:0 4px 0 #c99a0b;transform:rotate(-1.5deg)}
.logo .tag{margin-top:10px;color:var(--muted);font-size:14px}
.grid2{display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
@media (max-width:760px){.grid2{grid-template-columns:1fr}}
.card.pad{padding:18px}
.card h3{font-size:20px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.inp{flex:1;min-width:140px;font-size:18px;padding:12px 14px;border-radius:12px;border:3px solid var(--line);background:rgba(0,0,0,.35);color:#fff;outline:none;font-weight:600}
.inp:focus{border-color:var(--accent)}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.sw{width:38px;height:38px;border-radius:10px;border:3px solid rgba(255,255,255,.25);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.sw.sel{border-color:#fff;transform:scale(1.12)}
.plist{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:250px;overflow:auto}
.pitem{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.07);border-radius:14px;padding:8px 12px;font-size:19px;font-weight:600}
.pitem .no{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-size:15px}
.pitem .x{margin-left:auto;background:none;border:none;color:#ff8da1;font-size:22px}
.empty{color:var(--muted);font-size:15px;padding:10px 4px}
.seg{display:flex;gap:6px;background:rgba(0,0,0,.3);padding:5px;border-radius:14px}
.seg button{flex:1;border:none;background:none;color:var(--muted);font-weight:700;font-size:15px;padding:9px 6px;border-radius:10px}
.seg button.on{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
.mini-rec{font-size:15px;color:var(--muted)}
.mini-rec li{list-style:none;display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
.mini-rec li b{color:var(--yellow)}
.center{text-align:center}
.mt{margin-top:14px}
.muted{color:var(--muted)}

/* Blok avatar (CSS) */
.ava{display:inline-flex;flex-direction:column;align-items:center;--s:1}
.ava .h{width:calc(26px*var(--s));height:calc(26px*var(--s));background:#ffd23f;border-radius:calc(4px*var(--s));position:relative;box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.ava .h::before,.ava .h::after{content:"";position:absolute;top:32%;width:14%;height:24%;background:#111;border-radius:50%}
.ava .h::before{left:26%}.ava .h::after{right:26%}
.ava .h i{position:absolute;left:28%;right:28%;top:52%;height:22%;border:calc(2px*var(--s)) solid #111;border-top:none;border-radius:0 0 50% 50%}
.ava .t{width:calc(44px*var(--s));height:calc(40px*var(--s));background:var(--c);border-radius:calc(3px*var(--s));box-shadow:inset -4px -4px 0 rgba(0,0,0,.15)}
.ava .l{width:calc(44px*var(--s));height:calc(36px*var(--s));background:linear-gradient(90deg,#2b2d42 47%,transparent 47% 53%,#2b2d42 53%)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#hud>*{pointer-events:auto}
#topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
#topbar>*{pointer-events:auto}
.chip{display:flex;align-items:center;gap:8px;background:var(--panel);border:3px solid var(--line);border-radius:14px;padding:6px 12px;font-weight:700;font-size:17px;white-space:nowrap}
.chip .dot{width:16px;height:16px;border-radius:5px;border:2px solid #fff}
.chip.score{background:linear-gradient(180deg,#ffd84d,#f2b705);color:#3a2a00;border-color:#fff3}
.chip .mini{width:70px;height:9px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden}
.chip .mini i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff9f1c)}
.spacer{flex:1}
.ib{width:44px;height:44px;border-radius:12px;border:3px solid var(--line);background:var(--panel);color:#fff;font-size:20px;display:grid;place-items:center}
.ib:active{transform:translateY(2px)}

#healthPanel{position:absolute;top:66px;left:10px;width:232px;padding:10px;border-radius:18px}
#healthPanel .ph{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14px;letter-spacing:.5px;color:#cfe3ff;margin-bottom:6px}
#healthPanel .ph button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:8px;width:28px;height:24px;font-weight:700}
#healthPanel.col #hrows{display:none}
.hrow{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:10px;cursor:pointer}
.hrow:hover{background:rgba(255,255,255,.06)}
.hrow .ic{font-size:20px;width:26px;text-align:center}
.hrow .hm{flex:1;min-width:0}
.hrow .hn{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:#dbe5ff}
.hrow .hn b{font-size:14px}
.bar{height:10px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;border-radius:6px;transition:width .25s}
.hrow.warn .hn b{color:var(--warn)}
.hrow.crit{animation:blink 0.8s infinite}
.hrow.crit .hn b{color:var(--bad)}
@keyframes blink{50%{background:rgba(255,77,109,.28)}}

#rightCol{position:absolute;top:66px;right:10px;display:flex;flex-direction:column;gap:8px;align-items:flex-end;pointer-events:none}
#rightCol>*{pointer-events:auto}
#minimap{width:150px;height:150px;border-radius:18px;border:3px solid var(--line);background:var(--panel)}
#tasks{width:190px;padding:10px 12px;border-radius:16px;font-size:14px}
#tasks .tt{font-weight:700;color:#cfe3ff;font-size:13px;letter-spacing:.5px;margin-bottom:4px}
#tasks div.t{padding:2px 0;display:flex;gap:6px;color:#dbe5ff}
#tasks div.t.ok{color:var(--good);text-decoration:line-through;text-decoration-thickness:2px}

#olayBanner{position:absolute;top:62px;left:50%;transform:translateX(-50%);width:min(520px,calc(100vw - 520px));min-width:300px;
  display:flex;gap:12px;align-items:center;padding:10px 14px;border-radius:18px;background:linear-gradient(180deg,rgba(150,20,45,.92),rgba(95,10,30,.92));
  border:3px solid #ff8da1;box-shadow:0 0 0 4px rgba(255,77,109,.25),0 10px 30px rgba(0,0,0,.5);animation:pulseB 1s infinite}
@keyframes pulseB{50%{box-shadow:0 0 0 9px rgba(255,77,109,.12),0 10px 30px rgba(0,0,0,.5)}}
#olayBanner .oi{font-size:36px}
#olayBanner .ot{font-weight:700;font-size:18px}
#olayBanner .om{font-size:13.5px;color:#ffd9e0;line-height:1.25}
#olayBanner .okk{margin-left:auto;text-align:center;min-width:56px}
#olayArrow{font-size:30px;line-height:1;display:inline-block;transition:transform .1s;color:var(--yellow);text-shadow:0 2px 0 #000}
#olayKalan{font-weight:700;font-size:15px}
#olayMesafe{font-size:12px;color:#ffd9e0}

#prompt{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 18px;border-radius:16px;font-size:18px;font-weight:600;
  background:var(--panel2);border:3px solid #7cc8ff;white-space:nowrap;cursor:pointer;animation:pop .2s}
#prompt kbd{display:inline-block;background:#fff;color:#123;border-radius:7px;padding:1px 9px;margin-right:6px;font-family:inherit;font-weight:700;box-shadow:0 3px 0 #9ab}
#prompt.alert{border-color:#ff8da1;background:rgba(120,15,35,.95)}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}}
#hint{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);font-size:12.5px;color:rgba(220,230,255,.7);white-space:nowrap;pointer-events:none;text-shadow:0 1px 2px #000}

/* Dokunmatik */
#touch{display:none}
body.touch #touch{display:block}
body.touch #hint{display:none}
body.touch #prompt{bottom:150px}
#joy{position:absolute;left:24px;bottom:24px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.1);border:3px solid rgba(255,255,255,.3);touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:rgba(255,255,255,.75);box-shadow:0 4px 0 rgba(0,0,0,.3)}
.tbtn{position:absolute;width:84px;height:84px;border-radius:50%;border:4px solid rgba(255,255,255,.55);color:#fff;font-size:30px;font-weight:700;
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.tbtn small{font-size:11px;margin-top:3px;letter-spacing:.5px}
#btnJump{right:24px;bottom:28px;background:rgba(0,162,255,.75)}
#btnAct{right:122px;bottom:60px;background:rgba(51,209,122,.75)}
#btnAct.ready{animation:glow 0.9s infinite;background:rgba(51,209,122,.95)}
@keyframes glow{50%{box-shadow:0 0 0 10px rgba(51,209,122,.25),0 5px 0 rgba(0,0,0,.35)}}

#nisan{position:fixed;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.55);pointer-events:none;z-index:6;display:none}
body.fp #nisan{display:block}
#kilitIpucu{position:fixed;left:50%;top:58%;transform:translateX(-50%);padding:8px 14px;border-radius:12px;background:rgba(10,16,40,.72);color:#fff;font-size:14px;pointer-events:none;z-index:6;white-space:nowrap}
body.touch #kilitIpucu{display:none}
#flare{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;transition:opacity .4s;
  background:radial-gradient(ellipse at center,rgba(255,140,0,0) 40%,rgba(255,90,0,.55) 100%)}
#flare.on{opacity:1;animation:flr 0.7s infinite alternate}
@keyframes flr{from{filter:brightness(1)}to{filter:brightness(1.6)}}
#vignette{position:fixed;inset:0;pointer-events:none;opacity:0;z-index:4;transition:opacity .5s;
  background:radial-gradient(ellipse at center,rgba(255,0,40,0) 55%,rgba(255,0,40,.45) 100%)}
#vignette.on{opacity:1;animation:flr 1s infinite alternate}

#toasts{position:fixed;top:172px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;z-index:30;width:min(92vw,520px)}
.toast{background:var(--panel2);border:3px solid var(--line);border-radius:14px;padding:9px 16px;font-weight:600;font-size:16px;text-align:center;
  animation:tin .25s ease-out;box-shadow:0 8px 20px rgba(0,0,0,.4)}
.toast.good{border-color:#5be59a}.toast.bad{border-color:#ff8da1}.toast.warn{border-color:#ffc164}.toast.info{border-color:#7cc8ff}
.toast.out{animation:tout .35s forwards}
@keyframes tin{from{transform:translateY(-12px) scale(.9);opacity:0}}
@keyframes tout{to{transform:translateY(-10px);opacity:0}}
#floats{position:fixed;inset:0;pointer-events:none;z-index:15}
.float{position:absolute;font-weight:700;font-size:24px;text-shadow:0 3px 0 rgba(0,0,0,.6);animation:fl 1.2s ease-out forwards;transform:translate(-50%,-50%);white-space:nowrap}
@keyframes fl{to{transform:translate(-50%,-140%);opacity:0}}

/* ---------- Modal ---------- */
#modal{position:fixed;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(4,8,24,.55)}
#modalBox{width:100%;max-width:600px;max-height:calc(100vh - 28px);overflow:auto;padding:18px 20px 20px;animation:mpop .22s ease-out}
@keyframes mpop{from{transform:scale(.88);opacity:0}}
.mh{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.mh .mi{font-size:40px;width:58px;height:58px;display:grid;place-items:center;background:rgba(255,255,255,.1);border-radius:16px}
.mh h2{font-size:26px}
.lead{color:#dbe5ff;font-size:16.5px;line-height:1.4;margin-bottom:10px}
.fact{margin-top:12px;background:rgba(0,162,255,.14);border:2px solid rgba(0,162,255,.45);border-radius:14px;padding:10px 12px;font-size:14.5px;line-height:1.4;color:#d8efff}
.fact b{color:#7cd3ff}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.opt{text-align:left;border:3px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:12px 14px;font-size:16.5px;font-weight:600;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.opt:hover{background:rgba(255,255,255,.13)}
.opt.right{background:rgba(51,209,122,.3);border-color:#5be59a}
.opt.wrong{background:rgba(255,77,109,.3);border-color:#ff8da1}
.opt:disabled{cursor:default}
.res{margin-top:12px;padding:12px;border-radius:14px;font-size:16px;line-height:1.4}
.res.good{background:rgba(51,209,122,.18);border:2px solid #5be59a}
.res.bad{background:rgba(255,77,109,.16);border:2px solid #ff8da1}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:14px;flex-wrap:wrap}
.scanbar{height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 12px}
.scanbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00e1ff,#33d17a);animation:scan 2.6s linear forwards}
@keyframes scan{to{width:100%}}
.vitals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.vitals{grid-template-columns:1fr}}
.vital{display:flex;justify-content:space-between;align-items:center;gap:8px;background:rgba(255,255,255,.07);border-radius:12px;padding:8px 10px;font-size:14.5px;opacity:0;animation:vin .3s forwards}
.vital b{font-size:15.5px}
.vital b.ok{color:#5be59a}.vital b.warn{color:#ffc164}.vital b.crit{color:#ff8da1}
@keyframes vin{to{opacity:1}}
.tapzone{display:flex;flex-direction:column;align-items:center;gap:12px;margin:8px 0}
.tapbtn{width:170px;height:170px;border-radius:50%;border:none;font-size:34px;font-weight:700;color:#fff;background:radial-gradient(circle at 35% 30%,#ffb347,#ff6a00);
  box-shadow:0 9px 0 #b34700,0 14px 30px rgba(0,0,0,.45);touch-action:manipulation}
.tapbtn:active{transform:translateY(7px);box-shadow:0 2px 0 #b34700}
.tapcount{font-size:44px;font-weight:700}
.prog{width:100%;height:14px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff6a00)}
.choice2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigchoice{border:3px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:18px;padding:16px 12px;font-size:17px;font-weight:600;line-height:1.3;box-shadow:0 5px 0 rgba(0,0,0,.3)}
.bigchoice .e{font-size:44px;display:block;margin-bottom:6px}
.bigchoice:hover{background:rgba(255,255,255,.13)}
.foods{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media (max-width:520px){.foods{grid-template-columns:repeat(3,1fr)}}
.food{border:3px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:14px;padding:8px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
.food .e{font-size:32px}
.food.sel{border-color:var(--yellow);background:rgba(255,207,51,.2);transform:translateY(-2px)}
.plants{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.plant{height:96px;border-radius:16px;border:3px solid var(--line);background:rgba(80,180,90,.15);font-size:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;color:#fff}
.plant small{font-size:12px;font-weight:600}
.plant.dry{background:rgba(160,110,40,.25);border-color:#ffc164;filter:saturate(.3)}
.plant.dry::after{content:"💧";position:absolute;top:4px;right:8px;font-size:24px;filter:none;animation:bob .5s infinite alternate}
@keyframes bob{to{transform:translateY(-5px)}}
.moods{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.mood{flex:1;min-width:80px;border:3px solid var(--line);background:rgba(255,255,255,.07);color:#fff;border-radius:16px;padding:10px 4px;font-size:14px;font-weight:600}
.mood .e{font-size:38px;display:block}
.callbox{height:150px;border-radius:16px;background:linear-gradient(180deg,#123,#0a1a33);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;font-size:16px;position:relative;overflow:hidden}
.callbox .big{font-size:56px;animation:bob .6s infinite alternate}
.sleepbox{height:170px;border-radius:16px;background:linear-gradient(180deg,#0b0f2a,#1b1f4a);display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;overflow:hidden}
.zz{position:absolute;font-size:28px;animation:zz 1.6s linear infinite;opacity:0}
@keyframes zz{0%{opacity:0;transform:translate(0,0)}20%{opacity:1}100%{opacity:0;transform:translate(40px,-90px)}}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:520px){.checks{grid-template-columns:1fr}}

/* Karne & sonuç */

/* ---------- Çarpışma sistemi ---------- */
const COL=[];
function addCol(x,z,th,hx,hz,top,land){COL.push({x,z,c:Math.cos(th),s:Math.sin(th),hx,hz,top,land:!!land});}
function cozCarpisma(p,r){
  for(const o of COL){
    if(p.y>=o.top-.05)continue;
    const dx=p.x-o.x,dz=p.z-o.z;
    let lx=dx*o.c-dz*o.s,lz=dx*o.s+dz*o.c;
    const cx=clamp(lx,-o.hx,o.hx),cz=clamp(lz,-o.hz,o.hz);
    const ex=lx-cx,ez=lz-cz,d2=ex*ex+ez*ez;
    if(d2>=r*r)continue;
    if(d2>1e-8){const d=Math.sqrt(d2),push=r-d;lx+=ex/d*push;lz+=ez/d*push;}
    else{const px=o.hx-Math.abs(lx),pz=o.hz-Math.abs(lz);if(px<pz)lx=Math.sign(lx||1)*(o.hx+r);else lz=Math.sign(lz||1)*(o.hz+r);}
    p.x=o.x+lx*o.c+lz*o.s;p.z=o.z-lx*o.s+lz*o.c;
  }
}
function zeminY(p){
  let g=0;
  for(const o of COL){
    if(!o.land)continue;
    const dx=p.x-o.x,dz=p.z-o.z,lx=dx*o.c-dz*o.s,lz=dx*o.s+dz*o.c;
    if(Math.abs(lx)<=o.hx+.25&&Math.abs(lz)<=o.hz+.25&&p.y>=o.top-.45)g=Math.max(g,o.top);
  }
  return g;
}

/* ---------- Oyuncu fiziği & kamera ---------- */
const P={x:0,y:0,z:7,vy:0,yer:true,yon:Math.PI,faz:0,hiz:0};
const kam={yaw:0,pitch:.38,uzak:13,fp:!!Store.get('astroSaglik_gozKamera',false),bak:0};
const HIZ=9,YERCEKIM=30,ZIPLAMA=11.5;
const tus={};let ziplaIstek=false;
const joy={x:0,y:0,id:null};

function hareket(dt){
  let ix=0,iz=0;
  if(tus.KeyW||tus.ArrowUp)iz+=1;if(tus.KeyS||tus.ArrowDown)iz-=1;
  if(tus.KeyA||tus.ArrowLeft)ix-=1;if(tus.KeyD||tus.ArrowRight)ix+=1;
  ix+=joy.x;iz-=joy.y;
  const len=Math.hypot(ix,iz);if(len>1){ix/=len;iz/=len;}
  const fx=-Math.sin(kam.yaw),fz=-Math.cos(kam.yaw),rx=Math.cos(kam.yaw),rz=-Math.sin(kam.yaw);
  const mx=(fx*iz+rx*ix)*HIZ,mz=(fz*iz+rz*ix)*HIZ;
  P.x+=mx*dt;P.z+=mz*dt;
  cozCarpisma(P,.65);
  P.x=clamp(P.x,-31,31);P.z=clamp(P.z,-31,31);
  if(ziplaIstek&&P.yer){P.vy=ZIPLAMA;P.yer=false;Ses.zipla();}
  ziplaIstek=false;
  P.vy-=YERCEKIM*dt;P.y+=P.vy*dt;
  const g=zeminY(P);
  if(P.y<=g){P.y=g;P.vy=0;P.yer=true;}else if(P.y>g+.05)P.yer=false;
  const sp=Math.hypot(mx,mz);P.hiz=sp;
  if(kam.fp){P.yon=kam.yaw+Math.PI;}
  else if(sp>.1){const hedef=Math.atan2(mx,mz);let d=hedef-P.yon;d=Math.atan2(Math.sin(d),Math.cos(d));P.yon+=d*Math.min(1,dt*14);}
}
function avatarAnim(dt){
  const u=avatar.userData;
  avatar.position.set(P.x,P.y,P.z);avatar.rotation.y=P.yon;
  P.faz+=dt*P.hiz*1.25;
  const amt=P.hiz>.1?1:0;
  let kolHedef,bacak;
  if(!P.yer){kolHedef=-Math.PI*.85;bacak=.35;}
  else{kolHedef=Math.sin(P.faz)*.9*amt;bacak=Math.sin(P.faz)*.9*amt;}
  const k=Math.min(1,dt*16);
  u.kolL.rotation.x+=(kolHedef-u.kolL.rotation.x)*k;
  u.kolR.rotation.x+=((P.yer?-kolHedef:kolHedef)-u.kolR.rotation.x)*k;
  u.bacL.rotation.x+=(-bacak-u.bacL.rotation.x)*k;

function planOlustur(){

    const gunes=(d===2||d===4||d===6);
    const a=gunes?'gunes':sonraki(),c=sonraki();

function haritaCiz(){
  const W=mm.width,s=W/66,M=(x,z)=>[(x+33)*s,(z+33)*s];
  mmx.clearRect(0,0,W,W);
  mmx.fillStyle='rgba(60,71,114,.9)';rr(mmx,s,s,64*s,64*s,10);mmx.fill();
  mmx.strokeStyle='#34d5ff';mmx.lineWidth=3;mmx.stroke();
  mmx.fillStyle='#34406e';mmx.beginPath();mmx.arc(...M(0,0),3.6*s,0,7);mmx.fill();
  mmx.fillStyle='rgba(255,255,255,.18)';
  KUTULAR.forEach(k=>{const [x,y]=M(k[0]-k[2]/2,k[1]-k[2]/2);mmx.fillRect(x,y,k[2]*s,k[2]*s);});
  mmx.fillStyle='#7cf3ff';kristaller.forEach(m=>{if(m.visible){const [x,y]=M(m.position.x,m.position.z);mmx.fillRect(x-3,y-3,6,6);}});
  mmx.textAlign='center';mmx.textBaseline='middle';mmx.font=`${Math.round(W*.085)}px "Segoe UI Emoji","Apple Color Emoji",sans-serif`;
  for(const st of ISTASYON){
    const [x,y]=M(st.x,st.z);
    const hedef=G.olay&&G.olay.hedef===st.id;
    if(hedef){mmx.strokeStyle=G.olay.flare?'#ffa000':'#ff3355';mmx.lineWidth=5;mmx.beginPath();mmx.arc(x,y,W*.075+Math.sin(T*8)*4,0,7);mmx.stroke();}
    mmx.fillStyle=st.css;mmx.beginPath();mmx.arc(x,y,W*.06,0,7);mmx.fill();
    mmx.fillText(st.ik,x,y+1);
  }
  const [px,py]=M(P.x,P.z);
  mmx.save();mmx.translate(px,py);mmx.rotate(-P.yon+Math.PI);
  mmx.fillStyle=G.oyuncular[G.sira]?G.oyuncular[G.sira].renk:'#fff';mmx.strokeStyle='#fff';mmx.lineWidth=3;
  mmx.beginPath();mmx.moveTo(0,-W*.05);mmx.lineTo(W*.035,W*.035);mmx.lineTo(-W*.035,W*.035);mmx.closePath();mmx.fill();mmx.stroke();mmx.restore();
}

/* =====================================================================
   ANA DÖNGÜ
   ===================================================================== */
let sonZaman=performance.now(),T=0,hudT=0,menuAci=0;
function boyut(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
addEventListener('resize',boyut);boyut();
const hedefV=new THREE.Vector3();
function kameraGuncelle(dt){
  const oyunda=G.durum==='oyun'||G.durum==='modal'||G.durum==='duraklat';
  avatar.visible=!(oyunda&&kam.fp);
  if(G.durum!=='oyun')kilitAc();
  if(oyunda&&kam.fp){
    // Oyuncunun gözünden: kafa hizasında, bakış yönü yaw + bak
    const sall=P.yer&&P.hiz>.1?Math.abs(Math.sin(P.faz))*.06:0;
    const gx=P.x-Math.sin(kam.yaw)*.25,gz=P.z-Math.cos(kam.yaw)*.25,gy=P.y+2.55+sall;
    camera.position.set(gx,gy,gz);
    const cb=Math.cos(kam.bak);
    hedefV.set(gx-Math.sin(kam.yaw)*cb,gy-Math.sin(kam.bak),gz-Math.cos(kam.yaw)*cb);
    camera.lookAt(hedefV);
    kam.anlik=null;
  }else if(oyunda){
    const cp=Math.cos(kam.pitch),ox=Math.sin(kam.yaw)*cp,oy=Math.sin(kam.pitch),oz=Math.cos(kam.yaw)*cp;
    // kamera binaların içine girmesin
    let uz=kam.uzak;
    for(let d=1;d<=kam.uzak;d+=.4){
      const q={x:P.x+ox*d,y:P.y+1.6+oy*d,z:P.z+oz*d};
      if(COL.some(o=>{if(q.y>o.top)return false;const dx=q.x-o.x,dz=q.z-o.z,lx=dx*o.c-dz*o.s,lz=dx*o.s+dz*o.c;return Math.abs(lx)<o.hx+.3&&Math.abs(lz)<o.hz+.3;})){uz=Math.max(2.2,d-.5);break;}
    }
    kam.anlik=kam.anlik==null?uz:kam.anlik+(uz-kam.anlik)*Math.min(1,dt*(uz<kam.anlik?20:4));
    camera.position.set(P.x+ox*kam.anlik,P.y+1.6+oy*kam.anlik,P.z+oz*kam.anlik);
    hedefV.set(P.x,P.y+1.6,P.z);camera.lookAt(hedefV);
  }else if(G.durum==='intro'){
    menuAci+=dt*.25;
    camera.position.set(P.x+Math.sin(menuAci)*8,3.2,P.z+Math.cos(menuAci)*8);camera.lookAt(P.x,1.6,P.z);
  }else{
    menuAci+=dt*.07;
    camera.position.set(Math.sin(menuAci)*40,21,Math.cos(menuAci)*40);camera.lookAt(0,2,0);
  }
}
function dunyaAnim(dt){
  earth.rotation.y+=dt*.02;moon.rotation.y+=dt*.01;
  holo.rotation.y+=dt*.6;holo.rotation.x+=dt*.2;holoRing.rotation.z+=dt*.4;
  const kalpAtis=1+Math.max(0,Math.sin(T*6))*.12;holoIc.scale.setScalar(kalpAtis);
  holo.position.y=holoIc.position.y=holoRing.position.y=4.4+Math.sin(T*1.5)*.15;
  for(const m of kristaller){if(!m.visible)continue;m.rotation.y+=dt*2;m.position.y=(m.userData.y0||1.2)+Math.sin(T*2+m.userData.ofs)*.2;}
  for(const st of ISTASYON){
    const hazir=!(G.cd&&G.cd[st.id]>0);const hedef=G.olay&&G.olay.hedef===st.id;
    st.pad.material.emissiveIntensity=hedef?.9+Math.sin(T*8)*.4:hazir?.55+Math.sin(T*3)*.15:.12;
    st.ring.scale.setScalar(1+(hazir||hedef?Math.sin(T*3)*.06:0));
    st.ring.material.color.set(hedef?(G.olay.flare?0xffa000:0xff3355):hazir?0xffffff:0x556080);
  }
  if(isin.visible){isin.material.opacity=.22+Math.sin(T*6)*.1;isin.rotation.y+=dt;}
}
function dongu(now){
  requestAnimationFrame(dongu);
  const dt=Math.min(.1,(now-sonZaman)/1000);sonZaman=now;T+=dt;
  if(G.durum==='oyun')guncelle(dt);
  avatarAnim(dt);
  dunyaAnim(dt);
  kameraGuncelle(dt);
  hudT+=dt;
  if(hudT>.1&&(G.durum==='oyun'||G.durum==='modal')){hudT=0;hudGuncelle();}
  kilitIpucuGuncelle();
  renderer.render(scene,camera);
}

// Başlat (yazı tipi yüklenince etiketler güzel görünsün)
const fontHazir=document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1500))]):Promise.resolve();
avatarAyarla('?',seciliRenk);
fontHazir.then(()=>{
  // etiketleri yeniden çiz (Fredoka yüklendiyse)
  ISTASYON.forEach(st=>{const p=st.lab.parent,pos=st.lab.position.clone();p.remove(st.lab);const lab=etiket(`${st.ik} ${st.ad}`,st.css+'dd',1.5);lab.position.copy(pos);p.add(lab);st.lab=lab;});
  menu();
});
requestAnimationFrame(dongu);

// Test/geliştirme için dışarı aç
window.__astro={G,P,kam,kameraModu,bakisDondur,olayBaslat,etkiles,bitir,ISTASYON};
})();
